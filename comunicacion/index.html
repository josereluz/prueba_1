<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supervisi&oacute;n Comunicaci&oacute;n</title>

  <!-- Favicon -->
  <link rel="icon" href="favicon.ico" sizes="any">
  <meta name="theme-color" content="#0f766e">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />

  <!-- CSS personalizado -->
  <link rel="stylesheet" href="css/estilo.css?v=fix_controles_popup_20260630">
</head>
<body class="tema-comunicacion">
  <div class="container">
    <!-- Panel -->
    <div class="panel-capas" id="panelCapas">
      <div class="panel-header">
        <div class="panel-brand">
          <h3>Supervisi&oacute;n<br>Comunicaci&oacute;n</h3>
        </div>
      </div>

      <div class="panel-content">


        <!-- Distrito -->
        <div class="district-section">
          <h4 class="section-title">Distrito</h4>
          <select id="search-distrito">
            <option value="">Seleccionar distrito</option>
          </select>
        </div>

        <!-- Lotes -->
        <div class="district-section lote-section">
          <h4 class="section-title">Lotes</h4>
          <select id="search-lote-grupo">
            <option value="">Seleccionar lote</option>
            <option value="lote_3ab">Lote 3A – 3B (Comas e Independencia)</option>
            <option value="lote_3c">Lote 3C (SMP)</option>
            <option value="lote_4">Lote 4 (San Miguel, El Agustino)</option>
            <option value="lote_5">Lote 5 (Chorrillos, SJM, VES)</option>
            <option value="lote_6">Lote 6 (Lima)</option>
          </select>
        </div>

        <!-- Buscador -->
        <div class="grupo buscador-grupo">
          <div class="grupo-header grupo-header-top" data-target="grupo-buscador">
            <span><span class="header-label header-label-top">Buscador</span></span>
            <span class="arrow">&#9656;</span>
          </div>
          <div class="grupo-body closed" id="grupo-buscador">
            <div class="buscador-section buscador-section-accordion">
              <label for="search-poligono">Pol&iacute;gono</label>
              <input type="text" id="search-poligono" placeholder="Ej: 260210013, 260210015">

              <label for="search-sector">Sector</label>
              <input type="text" id="search-sector" placeholder="Ej: 01">

              <label for="search-manzana">Manzana</label>
              <input type="text" id="search-manzana" placeholder="Ej: 018">

              <label for="search-lote">Lote</label>
              <input type="text" id="search-lote" placeholder="Ej: 010">

              <button id="btn-search">Buscar</button>
              <div id="search-result" class="search-result"></div>
            </div>
          </div>
        </div>

        <hr class="sep">

        <!-- Capas -->
        <div class="control-capas">
          <h4 class="section-title control-title">Controlador de Capas</h4>

          <div class="grupo">
            <div class="grupo-header grupo-header-top" data-target="grupo-poligonos-cic">
              <span><span class="header-label header-label-top">Pol&iacute;gono</span></span>
              <span class="arrow">&#9656;</span>
            </div>
            <div class="grupo-body closed" id="grupo-poligonos-cic">
              <div class="capa-item capa-item-nested" style="margin-top:0;">
                <label><input type="checkbox" id="layer-poligonos-supervision"><span>Pol&iacute;gono</span></label>
              </div>
              <div class="capa-item capa-item-nested">
                <label><input type="checkbox" id="layer-poligonos-activos"><span>Pol&iacute;gono CIC activos</span></label>
              </div>
              <div class="capa-item capa-item-nested">
                <label><input type="checkbox" id="layer-poligonos-labels"><span>Etiquetas de pol&iacute;gono</span></label>
              </div>
            </div>
          </div>

          <div class="grupo">
            <div class="grupo-header grupo-header-top" data-target="grupo-conflicto">
              <span><span class="header-label header-label-top">Conflicto Territorial</span></span>
              <span class="arrow">&#9656;</span>
            </div>
            <div class="grupo-body closed" id="grupo-conflicto">
              <div class="capa-item capa-item-nested" style="margin-top:0;">
                <label><input type="checkbox" id="layer-conflicto-zona"><span>Zona en controversia</span></label>
              </div>
            </div>
          </div>

          <div class="grupo">
            <div class="grupo-header grupo-header-top" data-target="grupo-base">
              <span><span class="header-label header-label-top">Capa Base</span></span>
              <span class="arrow">&#9656;</span>
            </div>
            <div class="grupo-body closed" id="grupo-base">
              <div class="capa-item capa-item-nested" style="margin-top:0;">
                <label><input type="checkbox" id="layer-base-municipalidad"><span>Municipalidad Distrital</span></label>
              </div>
              <div class="capa-item capa-item-nested">
                <label><input type="checkbox" id="layer-base-centro-operacion"><span>Centro de Operaci&oacute;n Distrital</span></label>
              </div>
              <div class="capa-item capa-item-nested">
                <label><input type="checkbox" id="layer-base-manzana"><span>Manzana</span></label>
              </div>
              <div class="capa-item capa-item-nested">
                <label><input type="checkbox" id="layer-base-sector"><span>Sector</span></label>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="mobile-panel-overlay" id="mobilePanelOverlay" aria-hidden="true"></div>

    <!-- Mapa -->
    <div id="map"></div>
  </div>



  <!-- Modal login simple -->
  <div id="login-modal" class="login-modal" aria-hidden="true">
    <div class="login-modal-card" role="dialog" aria-modal="true" aria-labelledby="login-modal-title">
      <button type="button" class="modal-close-btn" id="btn-login-close" aria-label="Cerrar">&times;</button>
      <h2 id="login-modal-title">Iniciar sesi&oacute;n</h2>

      <label for="login-usuario">Usuario</label>
      <input type="text" id="login-usuario" autocomplete="username" placeholder="Usuario">

      <label for="login-clave">Contrase&ntilde;a</label>
      <div class="login-password-wrap">
        <input type="password" id="login-clave" autocomplete="current-password" placeholder="Contrase&ntilde;a">
        <button type="button" id="btn-toggle-password" class="password-toggle-btn" aria-label="Mostrar contrase&ntilde;a" title="Mostrar contrase&ntilde;a">👁</button>
      </div>

      <div id="login-error" class="login-error" aria-live="polite"></div>

      <div class="login-modal-actions">
        <button type="button" id="btn-login-cancel" class="btn-secondary">Cancelar</button>
        <button type="button" id="btn-login-submit" class="btn-primary">Ingresar</button>
      </div>
    </div>
  </div>

  <!-- Modal de edición de Polígono -->
  <div id="poligono-edit-modal" class="poligono-edit-modal" aria-hidden="true">
    <div class="poligono-edit-card" role="dialog" aria-modal="true" aria-labelledby="poligono-edit-title">
      <button type="button" class="modal-close-btn" id="btn-poligono-edit-close" aria-label="Cerrar">&times;</button>
      <h2 id="poligono-edit-title">Editar pol&iacute;gono</h2>
      <div class="edit-poligono-code" id="edit-poligono-code">-</div>

      <form id="poligono-edit-form" autocomplete="off">
        <input type="hidden" id="edit-codigo-poligono">

        <label for="edit-lote-empresa">Lote / Empresa</label>
        <input type="text" id="edit-lote-empresa">

        <label for="edit-version">Versi&oacute;n</label>
        <input type="text" id="edit-version" placeholder="Ej: V1">

        <label for="edit-n-cic">N&deg; CIC</label>
        <input type="text" id="edit-n-cic" placeholder="Ej: CIC-13">

        <label for="edit-cic-difusion">CIC difusi&oacute;n</label>
        <input type="date" id="edit-cic-difusion">

        <label for="edit-fotografias-difusion">Fotograf&iacute;as difusi&oacute;n</label>
        <textarea id="edit-fotografias-difusion" rows="2" placeholder="Pega URL"></textarea>

        <label for="edit-cic-inicio">CIC inicio</label>
        <input type="date" id="edit-cic-inicio">

        <label for="edit-fotografias-inicio">Fotograf&iacute;as inicio</label>
        <textarea id="edit-fotografias-inicio" rows="2" placeholder="Pega URL"></textarea>

        <label for="edit-cic-cierre">CIC cierre</label>
        <input type="date" id="edit-cic-cierre">

        <label for="edit-fotografias-cierre">Fotograf&iacute;as cierre</label>
        <textarea id="edit-fotografias-cierre" rows="2" placeholder="Pega URL"></textarea>

        <div id="poligono-edit-msg" class="poligono-edit-msg" aria-live="polite"></div>

        <div class="poligono-edit-actions">
          <button type="button" id="btn-poligono-edit-cancel" class="btn-secondary">Cancelar</button>
          <button type="submit" class="btn-primary">Guardar</button>
        </div>
      </form>
    </div>
  </div>


  <!-- Leaflet JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>

  <!-- Turf JS para calcular solo las zonas superpuestas de distritos -->
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>

  <!-- Datos CIC procesados desde CSV -->
  <script src="data/cic_info.js?v=20260630_cic"></script>

  <!-- Script -->
  <script src="js/map.js?v=cic_popup_20260630"></script>

  <!-- Modal selector de distrito -->
  <div id="district-modal" class="district-modal" aria-hidden="true">
    <div class="district-modal-card" role="dialog" aria-modal="true" aria-labelledby="district-modal-title">
      <h2 id="district-modal-title">&iquest;Qu&eacute; distrito deseas visualizar?</h2>

      <div class="district-modal-actions" id="district-modal-actions">
        <button type="button" class="district-btn district-btn-loading" disabled>
          <span class="district-btn-title">Cargando distritos...</span>
        </button>
      </div>
    </div>
  </div>

</body>
</html>
